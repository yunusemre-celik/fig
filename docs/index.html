<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fig — Bu Çark Zaman Kazandırıyor | Dosya Araç Kiti</title>
  <meta name="description" content="Hayır, saat çarkı değil; işlem çarkı. Fig ile web sitelerinde reklam izlemeye son verin. Döndürün ve anında dönüştürün.">
  <link rel="icon" type="image/svg+xml" href="figlogo.svg">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .embed-wrapper {
      position: relative;
      width: 100%;
      max-width: 1366px;
      margin: 0 auto;
      height: 0;
      padding-top: 353.7335%;
      overflow: hidden;
      will-change: transform;
    }
    .embed-wrapper iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      border: none;
      padding: 0;
      margin: 0;
    }
    /* Floating 1-Click Direct Download Bar */
    .floating-download-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 12px 26px;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: #FFFFFF;
      border-radius: 9999px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .floating-download-bar:hover {
      transform: translateX(-50%) translateY(-2px) scale(1.02);
      background: #000000;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.38);
    }
    .floating-download-bar svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
    .floating-badge {
      font-size: 11px;
      background: rgba(99, 102, 241, 0.35);
      color: #C7D2FE;
      padding: 3px 9px;
      border-radius: 9999px;
      border: 1px solid rgba(165, 180, 252, 0.3);
      font-weight: 500;
    }
    @media (max-width: 600px) {
      .floating-download-bar {
        bottom: 16px;
        padding: 10px 18px;
        font-size: 14px;
      }
      .floating-badge {
        display: none;
      }
    }
  </style>
</head>
<body>

  <div class="embed-wrapper">
    <iframe loading="lazy" src="https://www.canva.com/design/DAHZfJ3WV24/N4Ki__7b_pHZb78nCST6Bg/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen">
    </iframe>
  </div>

  <!-- Direct 1-Click Download Pill for visitors -->
  <a href="Fig.exe" download="Fig.exe" class="floating-download-bar" title="Fig.exe Doğrudan İndir">
    <svg viewBox="0 0 88 88">
      <path d="M0 12.4L35.6 7.5V41.7H0V12.4ZM0 46.3H35.6V80.5L0 75.6V46.3ZM39.9 6.9L88 0V41.7H39.9V6.9ZM39.9 46.3H88V88L39.9 81.1V46.3Z"/>
    </svg>
    <span>Windows için İndir (Fig.exe)</span>
    <span class="floating-badge">Ücretsiz • 16.5 MB</span>
  </a>

</body>
</html>
