name: Windows 10 & 11 Compatibility CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  compat-test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust (MSVC Toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Cargo Check & Test (W10/W11 Target)
        run: |
          cargo check --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc
          cargo test --manifest-path src-tauri/Cargo.toml --target x86_64-pc-windows-msvc

      - name: Verify Package & Static Compatibility
        shell: powershell
        run: |
          if (Test-Path scripts\verify_windows_compat.ps1) {
            powershell -ExecutionPolicy Bypass -File scripts\verify_windows_compat.ps1
          }
