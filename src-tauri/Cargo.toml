[package]
name = "fig"
version = "0.1.0"
description = "Fig - Native Windows 11 File Toolkit"
authors = ["yunus"]
edition = "2024"

[lib]
name = "fig_lib"
crate-type = ["lib"]

[[bin]]
name = "fig"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.7"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
