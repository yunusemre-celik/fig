[package]
name = "fig"
version = "0.1.0"
description = "Fig - Native Windows 11 File Toolkit"
authors = ["yunus"]
edition = "2024"

[lib]
name = "fig_lib"
crate-type = ["lib"]

[[bin]]
name = "fig"
path = "src/main.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "gif", "tiff"] }
qrcode = { version = "0.14", default-features = false }
rqrr = "0.7"
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
window-vibrancy = "0.8.1"

[profile.release]
codegen-units = 16
lto = false
opt-level = 2
panic = "abort"
strip = true
